# Tooling configuration for the backend.
#
# The [tool.pytest.ini_options] block is load-bearing for CI. Without a config
# file here, `pytest` (the console script) never puts this directory on
# sys.path, and `from app.query.guard import guard_query` fails to import at
# collection time with "No module named 'app'". It only ever worked locally
# because `python -m pytest` adds the working directory itself -- CI runs the
# bare script, so it did not.

[tool.pytest.ini_options]
# The fix: this directory goes on sys.path, so `app` is importable however
# pytest is invoked.
pythonpath = ["."]
testpaths = ["tests"]
# A marker typo should fail the run rather than silently skip what it guards.
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "RET", "SIM"]
# S101: asserts are the point of a test file.
# S105/S106: test fixtures carry obvious dummy credentials.
[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test file, and fixtures carry obvious dummies.
"tests/*" = ["S101", "S105", "S106"]
# The agent's system prompt. Rewrapping prompt text to satisfy a line length
# would change what the model is actually told, so E501 does not apply here.
"app/query/agent/prompts.py" = ["E501"]

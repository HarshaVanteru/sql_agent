[project]
name = "sql-agent-backend"
version = "2.0.0"
description = "Connect a database and ask it questions in plain English."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    # Sessions: the signed cookie that carries the session id.
    "itsdangerous>=2.2.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Connecting to the databases visitors bring. Synchronous drivers on
    # purpose -- the agent is synchronous and runs in a threadpool.
    "sqlalchemy>=2.0.51",
    "pymysql>=1.1.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=43.0.0",
    # The agent.
    "langchain-core>=1.4.8",
    "langchain-groq>=1.1.3",
    "langsmith>=0.1.0",
    # Observability.
    "logfire[fastapi,httpx,sqlalchemy]>=4.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.26.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

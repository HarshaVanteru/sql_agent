services:
  - type: web
    name: sql-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CREDENTIALS_KEY
        sync: false
      # From the Key Value instance below.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: sql-agent-redis
          property: connectionString
      # Exact origins, comma separated -- the session is a cookie, so "*" is
      # not usable here.
      - key: CORS_ORIGINS
        sync: false
      # A browser only sends a cross-site cookie when it is SameSite=None and
      # Secure, and Render terminates TLS, so both are required in production.
      - key: SESSION_COOKIE_SAMESITE
        value: "none"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_SECONDS
        value: "86400"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: LANGCHAIN_ENDPOINT
        value: "https://api.smith.langchain.com"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: "sql_agent"
      - key: LOGFIRE_ENVIRONMENT
        value: "production"
      - key: LOGFIRE_CONSOLE
        value: "true"

  - type: keyvalue
    name: sql-agent-redis
    plan: free
    # Sessions expire within 24 hours anyway, so evicting under pressure is the
    # right failure mode.
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []   # reachable only from inside the Render network

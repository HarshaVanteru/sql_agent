# Backend: test, build an image, push it to GHCR, then tell the server to pull it.
#
# Secrets this needs (Settings -> Secrets and variables -> Actions):
#   GHCR_USERNAME    GitHub username that owns the package
#   GHCR_PAT         classic PAT with write:packages (the server pulls with it too)
#   SERVER_HOST      deploy target, e.g. 203.0.113.10
#   SERVER_USERNAME  ssh user on that host
#   SERVER_SSH_KEY   that user's *private* key, whole file including BEGIN/END lines

name: backend

on:
  push:
    branches: [main, backend-session-rewrite]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# One deploy at a time per branch; a newer push waits rather than racing.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # The frontend will publish alongside this as askyourdatabase-frontend.
  IMAGE_BASE: askyourdatabase-backend
  DEPLOY_DIR: /var/www/html/askyourdatabase

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # requirements-dev.txt pulls in requirements.txt itself, so runtime deps
      # and test deps each stay described in exactly one place.
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Runs from backend/ (see defaults.run.working-directory). pyproject.toml
      # puts that directory on sys.path via `pythonpath`, which is what makes
      # `import app` work here: the bare `pytest` console script does not add
      # the working directory the way `python -m pytest` does, so before that
      # config existed this step failed at collection with "No module named
      # 'app'". No Redis service container is needed -- the suite uses fakeredis.
      - name: Test
        run: pytest

  build:
    # Nothing is published from a pull request -- it only has to prove it builds.
    needs: test
 
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # The owner has to be lowercased -- GHCR rejects capitals in image names.
      - name: Work out the image name
        id: meta
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image=${REGISTRY}/${owner}/${IMAGE_BASE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # The sha tag is what gets deployed; latest is for humans on the box.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
    steps:
      - name: Set up the ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF

      - name: Pull the new image and restart the API
        run: |
          ssh deploy "BACKEND_IMAGE='$IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_PAT='$GHCR_PAT' DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_DIR"

          echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          # docker-compose.yml reads BACKEND_IMAGE. Recorded in .env as well, so a
          # later `docker compose up -d` by hand uses the same image, not an older one.
          export BACKEND_IMAGE
          touch .env
          grep -v '^BACKEND_IMAGE=' .env > .env.next || true
          echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> .env.next
          mv .env.next .env

          docker compose pull askyourdatabase
          docker compose up -d --remove-orphans
          docker image prune -f

          docker compose ps
          REMOTE

      - name: Check it came back up
        run: |
          ssh deploy "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          for _ in $(seq 1 30); do
            # /health/ready, not /health. Liveness only says the process is up,
            # which it would be even with Redis gone -- and a deploy that came
            # back up unable to reach its only datastore has not succeeded.
            # Readiness returns 503 in that case, so -f is enough here.
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "the API was not ready within 60s" >&2
          curl -sS -o /dev/null -w 'last /health status: %{http_code}\n' \
            http://127.0.0.1:8000/health || true
          curl -sS -w '\nlast /health/ready body above, status: %{http_code}\n' \
            http://127.0.0.1:8000/health/ready || true
          cd "$DEPLOY_DIR" && docker compose logs --tail=80 askyourdatabase
          exit 1
          REMOTE

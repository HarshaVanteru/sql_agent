# Frontend: build the Vite bundle and ship the dist to the server, where nginx
# serves it and proxies /api to the backend container on the same domain.
#
# No image and no container -- this is static files. VITE_API_URL is baked in at
# build time, so a change to it needs a rebuild, not a restart.
#
# Needs, besides the deploy secrets the backend already uses:
#   vars.VITE_API_URL   repository variable, e.g. https://askyourdb.nerchuko.in

name: frontend

on:
  push:
    branches: [main, backend-session-rewrite]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_DIR: /var/www/html/askyourdatabase

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # Empty here means the bundle silently falls back to localhost:8000 and
      # every request fails in the browser. Better to fail in CI.
      - name: Check VITE_API_URL is set
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables." >&2
            exit 1
          fi
          echo "building against $VITE_API_URL"

      # `npm run build` is `tsc -b && vite build`, so this typechecks too.
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Set up the ssh key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName $SERVER_HOST
            User $SERVER_USERNAME
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ServerAliveInterval 30
          EOF

      - name: Upload the build
        run: |
          echo "Uploading build with rsync..."
          ssh deploy "mkdir -p '$DEPLOY_DIR/frontend/releases'"
          # Into a new release directory rather than over the live one: rsync
          # deletes and replaces file by file, and a visitor who loads
          # index.html mid-sync gets 404s for the chunks it asks for.
          #
          # --link-dest hardlinks anything identical in the release currently
          # being served, so a rebuild that changes one chunk sends one chunk.
          # --chmod fixes the modes here; the artifact download does not keep them.
          rsync -avz --delete \
            --chmod=D755,F644 \
            --link-dest="$DEPLOY_DIR/frontend/dist/" \
            dist/ "deploy:$DEPLOY_DIR/frontend/releases/$GITHUB_SHA/"

      - name: Switch over
        run: |
          ssh deploy "SHA='$GITHUB_SHA' DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          root="$DEPLOY_DIR/frontend"
          release="$root/releases/$SHA"

          test -f "$release/index.html"

          # Two steps so the swap is one atomic rename -- no moment where
          # frontend/dist is missing or half replaced.
          ln -sfn "$release" "$root/dist.tmp"
          mv -Tf "$root/dist.tmp" "$root/dist"

          # Keep three: whatever is live, plus the two most recent others.
          # Excluding the live one by name matters after a manual rollback --
          # the release being served is then not the newest, and pruning purely
          # by age would delete the directory the symlink points at.
          current=$(basename "$(readlink -f "$root/dist")")
          cd "$root/releases"
          ls -1dt -- */ | sed 's#/$##' | grep -vx "$current" | tail -n +3 | xargs -r rm -rf

          echo "serving $(readlink -f "$root/dist")"
          ls "$root/dist"
          REMOTE
